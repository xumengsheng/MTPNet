# general settings,Flare 7K++,都用Uformer做基线模型
name: U_Net
model_type: DeflareModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: Flare7Kpp
    type: Flare7kpp_Pair_Loader
    image_path: /media/dpw/许孟笙/Flare/Flare7K-main/Flickr24K
    scattering_dict:
      Flare7k_scattering: /media/dpw//许孟笙/Flare/Flare7K-main/Flare7Kpp/Flare7K/Scattering_Flare/Compound_Flare
      Real_scattering1: /media/dpw//许孟笙/Flare/Flare7K-main/Flare7Kpp/Flare-R/Compound_Flare
    reflective_dict:
      Flare7k_reflective: /media/dpw//许孟笙/Flare/Flare7K-main/Flare7Kpp/Flare7K/Reflective_Flare
      Real_reflective1: /media/dpw//许孟笙/Flare/Flare7K-main/Flare7Kpp/Flare-R/Compound_Flare
    light_dict:
      Flare7k_light: /media/dpw//许孟笙/Flare/Flare7K-main/Flare7Kpp/Flare7K/Scattering_Flare/Core
      Real_light1: /media/dpw//许孟笙/Flare/Flare7K-main/Flare7Kpp/Flare-R/Light_Source
    data_ratio: [0.5, 0.5] # or [0.6, 0.4], only a ratio is enough
    transform_base:
      img_size: 256
    transform_flare:
      scale_min: 0.2
      scale_max: 1.2
      translate: 200
      shear: 20
    mask_type: ~

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: flare_test
    type: Image_Pair_Loader
#    dataroot_gt:/media/dpw//许孟笙/Flare/Flare7K-main/Flare7Kpp/test_data/synthetic/gt
#    dataroot_lq:/media/dpw//许孟笙/Flare/Flare7K-main/Flare7Kpp/test_data/synthetic/input
    dataroot_gt: /media/dpw//许孟笙/Flare/Flare7K-main/Flare7Kpp/test_data/real/gt
    dataroot_lq: E/Flare/Flare7K-main/Flare7Kpp/test_data/real/input
    gt_size: 256

# network structures
network_g:
  type: U_Net
# img_size: 512
  img_ch: 3
  output_ch: 3
#  multi_stage: 1

# path
path:
  pretrain_network_g:
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
#    type: CosineAnnealingRest
#     type: MultiStepLR
#     milestones: [200000]
#     gamma: 0.5
      type: CosineAnnealingRestartLR
      periods: [ 600000 ]
      restart_weights: [ 1 ]
      eta_min: !!float 1e-7

  out_deflare: True
  ema_decay: 0.9
  total_iter: 600000
  warmup_iter: -1  # no warm up

  # losses
  l1_opt:
    type: L_Abs_pure
    loss_weight: 0.5

  perceptual:
    type: L_percepture
    loss_weight: 0.5

  mse:
    type: MSELoss
    loss_weight: 0.1
    reduction: mean
#
#  bce:
#    type: BCELoss
#    loss_weight: 0.5
#    reduction: mean

#  flarebase:
#    type: MaskBaseLoss
#    loss_weight: 0.1

  FFT:
    type: FFTLoss
    loss_weight: 0.05

#  FocalFrequencyLoss:
#    type: FocalFrequencyLoss
#    loss_weight: 0.5

# validation settings
val:
  val_freq: !!float 5e3
  save_img: true

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
